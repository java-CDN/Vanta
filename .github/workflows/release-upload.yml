name: release-upload
on:
  workflow_dispatch:
    inputs:
      ci_run_id: { required: true }
      tag: { required: true }
permissions:
  contents: write
  actions: read
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ inputs.ci_run_id }} -R ${{ github.repository }} -n vanta-desktop-nsis -D dl
          cd dl && sha256sum *.exe > "$(ls *.exe).sha256" && cat *.sha256
          gh release upload ${{ inputs.tag }} * -R ${{ github.repository }} --clobber
