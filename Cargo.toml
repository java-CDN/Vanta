[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
data-encoding = "2"
vanta-types = { path = "crates/vanta-types" }
vanta-vault = { path = "crates/vanta-vault" }
vanta-store = { path = "crates/vanta-store" }
vanta-fingerprint = { path = "crates/vanta-fingerprint" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
